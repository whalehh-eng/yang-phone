</style></head><body><header><span class="wordmark">A pocket of stories.</span><span>INTERACTIVE PHONE · 01</span></header><main class="layout"><aside class="editorial"><div class="eyebrow">AN UNWRITTEN STORY</div><h1>有些故事，<br>从亮起的<br>屏幕开始。</h1><p>杨博文的虚拟手机。<br>轻触屏幕，走进尚待书写的日常。</p><div class="edition">IPHONE 17 PRO MAX · LIGHT</div></aside><section class="phone-column" aria-label="杨博文的虚拟手机"><div class="phone"><div class="screen" id="screen" data-mode="off"><div class="island" aria-hidden="true"></div><div class="status"><time id="status-time"></time><div class="status-icons" aria-hidden="true"><span class="signal"><i></i><i></i><i></i><i></i></span><span>⌁</span><span class="battery"><div></div></span></div></div><div class="view" id="view"></div><button class="home-bar" id="home" aria-label="返回主屏幕" hidden></button><div id="toast" class="toast" role="status" hidden></div></div></div><p class="under-phone" id="guide">轻触屏幕，开始体验</p><button id="power" class="power-button" hidden>⏻ &nbsp;屏幕关闭</button></section><aside class="side-note"><b>一部手机，一段未完的故事。</b>还没有来信，<br>也没有需要赶赴的约定。<br>照片、对话和那些细节，<br>等故事的主人慢慢填满。<div class="line"></div><span>外观与交互原型<br>未设密码 · 暂无剧情</span></aside></main><footer class="footer">虚构互动界面 · 非真实设备或私人数据 · 不会发起电话或读取位置</footer>

function renderApp(){const name=apps.find(a=>a[0]===currentApp)[1];let content='',tabs='';if(currentApp==='wechat'){const labels=['微信','通讯录','发现','我'];tabs=`<div class="tabs">${labels.map(t=>`<button data-tab="${t}" class="${subtab===t?'active':''}">${t}</button>`).join('')}</div>`;if(subtab==='我')content=`<div class="profile"><div class="avatar" aria-hidden="true">杨</div><div><strong>${escapeText(DATA.owner)}</strong><small>微信号：暂未填写</small></div></div><div class="settings-row">个人资料<span>等待补充</span></div><div class="settings-row">故事进度<span>尚未开始</span></div>`;else if(subtab==='通讯录')content=empty('wechat','通讯录还是空的','联系人姓名和关系尚未提供。');else if(subtab==='发现')content=empty('gallery','还没有新的动态','朋友圈与故事内容等待补充。');else content=`<input class="search-field" id="chat-search" aria-label="搜索微信聊天" placeholder="搜索">${empty('wechat','还没有聊天','对话、联系人和故事剧情先留白。以后，这里会有人发来消息。')}`;}
else if(currentApp==='messages')content=empty('messages','还没有信息','短信内容暂未填写，不会收到真实短信。');
else if(currentApp==='phone')content=empty('phone','暂无通话记录','联系人与通话台词尚未提供。这里不会拨打真实电话。');
else if(currentApp==='gallery')content=empty('gallery','还没有照片','壁纸和相册照片等待提供，不使用未经确认的人物照片。');
else if(currentApp==='notes')content=`<span class="prototype-tag">体验草稿 · 非人物真实内容</span><p class="small-text">可以在这里试着写字。关闭页面后草稿清除。</p><label for="draft" class="small-text">临时草稿</label><textarea id="draft" class="note-draft" placeholder="写下点什么…" maxlength="3000">${escapeText(draft)}</textarea><button class="text-action" id="clear-draft">清空体验草稿</button>`;
else if(currentApp==='map')content=`<div class="map-placeholder"><div class="map-caption">地图等待填写<small>不读取真实位置 · 地点尚未提供</small></div></div>`;
else if(currentApp==='search')content=`<input class="search-field" id="search-input" type="search" placeholder="输入关键词" aria-label="输入搜索关键词">${empty('search','没有搜索记录','这是本地搜索界面原型，暂不连接外部搜索服务。')}<p class="small-text" id="search-status" role="status"></p>`;
else if(currentApp==='calendar')content=calendar();view.innerHTML=`<div class="app-view"><div class="app-header"><button class="back" id="back" aria-label="返回主屏幕">‹</button><h2>${name==='微信'?subtab:name}</h2><span></span></div><div class="app-content">${content}</div>${tabs}</div>`;guide.textContent='左上角或底部横条返回主屏幕'}
function calendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),offset=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),today=new Date();return `<div class="calendar-nav"><button data-month="-1" aria-label="上个月">‹</button><span>${y}年${m+1}月</span><button data-month="1" aria-label="下个月">›</button></div><div class="month-grid">${['日','一','二','三','四','五','六'].map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const d=i+1;return `<button class="day ${d===selectedDay?'selected':''} ${d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear()?'today':''}" data-day="${d}" aria-label="${m+1}月${d}日">${d}</button>`}).join('')}</div><div class="calendar-detail">${m+1}月${selectedDay}日<small>暂无安排，故事日程等待补充。</small></div><button class="text-action" id="today">回到今天</button>`}
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='wake'){setMode('boot');bootTimer=setTimeout(()=>setMode('lock'),matchMedia('(prefers-reduced-motion: reduce)').matches?100:1200)}else if(b.id==='unlock')setMode('home');else if(b.dataset.app){currentApp=b.dataset.app;subtab='微信';setMode('app')}else if(b.id==='back')setMode('home');else if(b.dataset.tab){subtab=b.dataset.tab;renderApp()}else if(b.dataset.month){calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+Number(b.dataset.month),1);selectedDay=1;renderApp()}else if(b.dataset.day){selectedDay=Number(b.dataset.day);renderApp()}else if(b.id==='today'){calendarDate=new Date();selectedDay=calendarDate.getDate();renderApp()}else if(b.id==='clear-draft'){draft='';document.querySelector('#draft').value='';toast('体验草稿已清空')}});
view.addEventListener('input',e=>{if(e.target.id==='draft')draft=e.target.value;if(e.target.id==='search-input')document.querySelector('#search-status').textContent=e.target.value?'暂无可搜索内容。关键词：'+e.target.value:'';if(e.target.id==='chat-search'){const title=document.querySelector('.empty h3');title.textContent=e.target.value?'没有找到相关聊天':'还没有聊天'}});
power.addEventListener('click',()=>{clearTimeout(bootTimer);setMode('off')});home.addEventListener('click',()=>{if(mode==='app')setMode('home')});setInterval(()=>{document.querySelector('#status-time').textContent=time();const t=document.querySelector('.lock-time');if(t)t.textContent=time()},15000);setMode('off');
</script></body></html>
